name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server tests and ARM64 release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LazerTagWebServer.Tests/LazerTagWebServer.Tests.csproj

      - name: Test
        run: dotnet test LazerTagWebServer.Tests/LazerTagWebServer.Tests.csproj --configuration Release --no-restore

      - name: Check browser JavaScript
        run: |
          node --check LazerTagWebServer/wwwroot/js/app.js
          node --check LazerTagWebServer/wwwroot/js/snapshots.js
          node --test LazerTagWebServer.Tests/operator-console.test.cjs

      - name: Test published readiness and deployment rollback
        run: python3 deployment-tests/release-readiness-test.py

      - name: Validate deployment shell scripts
        run: bash deployment-tests/check-shell-syntax.sh

      - name: Test release archive staging and shell checks
        run: python3 deployment-tests/deployment-tools-test.py

      - name: Test hotspot readiness check
        run: bash deployment-tests/hotspot-check-test.sh

      - name: Verify production hotspot policy
        run: |
          grep -Fq 'wpa=2' deployment/configure-hotspot.sh
          grep -Fq 'wpa_key_mgmt=WPA-PSK' deployment/configure-hotspot.sh
          grep -Fq 'rsn_pairwise=CCMP' deployment/configure-hotspot.sh
          grep -Fq 'ieee80211w=0' deployment/configure-hotspot.sh
          ! grep -Eq 'wpa=(0|1|3)$|wpa_key_mgmt=.*SAE|rsn_pairwise=.*TKIP' deployment/configure-hotspot.sh

      - name: Verify dnsmasq privilege boundary
        run: |
          grep -Fq 'install -d -o root -g root -m 0750 "${DNSMASQ_STATE_DIR}"' deployment/install.sh
          grep -Fq 'StateDirectory=lazertag-dnsmasq' deployment/lazertag-dnsmasq.service
          grep -Fq 'StateDirectoryMode=0750' deployment/lazertag-dnsmasq.service
          grep -Fq 'UMask=0077' deployment/lazertag-dnsmasq.service
          ! grep -Eq '^CapabilityBoundingSet=.*CAP_DAC_OVERRIDE' deployment/lazertag-dnsmasq.service

      - name: Publish linux-arm64
        run: >-
          dotnet publish LazerTagWebServer/LazerTagWebServer.csproj
          --configuration Release
          --runtime linux-arm64
          --self-contained true
          --output artifacts/publish

      - name: Package release
        run: |
          tar -czf artifacts/lazertag-linux-arm64.tar.gz -C artifacts/publish .
          tar -czf artifacts/lazertag-deployment.tar.gz deployment
          sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lazertag-linux-arm64
          path: |
            artifacts/lazertag-linux-arm64.tar.gz
            artifacts/lazertag-deployment.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  updater:
    name: Windows LAN updater
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test updater and SSH upload
        run: dotnet test LazerTagUpdater.Tests/LazerTagUpdater.Tests.csproj -c Release
      - name: Publish standalone updater
        run: dotnet publish LazerTagUpdater/LazerTagUpdater.csproj -c Release -r win-x64 -o artifacts/updater
      - uses: actions/upload-artifact@v4
        with:
          name: lazertag-windows-updater
          path: artifacts/updater/LazerTagUpdater.exe
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: ESP32 relay compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install tested ESP32 board core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.7

      - name: Create compile-only Wi-Fi configuration
        run: >-
          cp esp32_relay/sketches/RelayESP32/RelaySecrets.example.h
          esp32_relay/sketches/RelayESP32/RelaySecrets.h

      - name: Check relay firmware invariants
        run: python3 esp32_relay/tests/source_invariants.py

      - name: Compile relay firmware
        run: >-
          arduino-cli compile
          --warnings all
          --fqbn esp32:esp32:esp32
          --libraries esp32_relay/libraries
          --output-dir artifacts/firmware
          esp32_relay/sketches/RelayESP32

      # The compile-check image contains placeholder Wi-Fi settings and is not
      # published. Build the venue image locally from git-ignored RelaySecrets.h.
