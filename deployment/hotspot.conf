# Root-owned settings consumed by configure-hotspot.sh. This file deliberately
# contains no Wi-Fi password; supply that through a mode-0600 password file.

HOTSPOT_CONNECTION='LazerTag'
HOTSPOT_INTERFACE='wlan0'
HOTSPOT_SSID='LazerTag'
HOTSPOT_BAND='bg'
HOTSPOT_CHANNEL='6'
HOTSPOT_COUNTRY='US'

# The server address is fixed because arena clients use this URL.
HOTSPOT_ADDRESS='192.168.4.1/24'

# Keep DHCP below .100 so dnsmasq can never lease the ESP32's static IP.
HOTSPOT_DHCP_RANGE='192.168.4.20,192.168.4.99'
HOTSPOT_RELAY_ADDRESS='192.168.4.100'

# Production policy: hostapd WPA2-PSK (RSN/CCMP), with no WPA1, WPA3, or open
# fallback. Standalone hostapd avoids the Pi 3/Trixie NetworkManager AP bug.
HOTSPOT_SECURITY='wpa2'
